<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><title>Register</title><link rel="stylesheet" href="/css/style.css"></head><body><main class="card"><h1>Create Account</h1><form id="f"><label>Role<select id="role"><option>patient</option><option>caregiver</option><option>doctor</option></select></label><label>Name<input id="name" required></label><label>Age<input id="age" type="number"></label><label>Blood Group<select id="blood_group"><option value="">Select</option><option>O-</option><option>O+</option><option>A-</option><option>A+</option><option>B-</option><option>B+</option><option>AB-</option><option>AB+</option></select></label><label>Emergency Contact<input id="emergency_contact"></label><label>Allergies<textarea id="allergies"></textarea></label><label>Medicines<textarea id="medicines"></textarea></label><label>Medical History<textarea id="medical_history"></textarea></label><label>Password<input id="password" type="password" minlength="6" required></label><button class="btn">Register</button></form><p id="msg"></p><a href="/login.html">Login</a></main><script src="/js/register.js"></script></body></html>
